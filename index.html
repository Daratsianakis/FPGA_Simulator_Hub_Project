<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackboard Simulator Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="projects_data.js"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
        .panel { background-color: #1e293b; border: 1px solid #334155; border-radius: 0.75rem; }
        .sim-card { transition: all 0.2s ease-in-out; }
        .sim-card:hover { transform: translateY(-2px); border-color: #3b82f6; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2); background-color: #111827; }
    </style>
</head>
<body class="flex flex-col items-center p-6 min-h-screen">
    <div class="max-w-7xl w-full">
        <!-- Header -->
        <header class="mb-6 flex justify-between items-end border-b border-slate-700 pb-4">
            <div>
                <h1 id="hub-title" class="text-3xl font-bold text-blue-400 mb-1">Available Projects</h1>
                <p id="hub-subtitle" class="text-slate-400 text-sm">Select a project folder to view its simulators.</p>
            </div>
            <div>
                <button id="back-btn" onclick="goBack()" class="hidden px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded text-sm font-bold border border-slate-500 transition-colors">
                    &#8592; Back to Projects
                </button>
            </div>
        </header>

        <div class="flex flex-col gap-6 w-full pb-10">
            <div class="panel p-8 shadow-xl w-full">
                <div class="w-full flex justify-between items-center mb-6 border-b border-slate-700/50 pb-4">
                    <h2 id="section-title" class="text-lg font-bold text-slate-300 uppercase tracking-widest">Directory</h2>
                    <div class="flex items-center gap-3 bg-slate-900 p-2 rounded border border-slate-700">
                        <label class="text-xs font-bold text-slate-400">SYSTEM STATUS:</label>
                        <div class="w-3 h-3 rounded-full bg-green-400 shadow-[0_0_8px_#4ade80]"></div>
                    </div>
                </div>

                <div id="sim-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentProject = null;

        function renderGrid() {
            const grid = document.getElementById('sim-grid');
            const title = document.getElementById('hub-title');
            const subtitle = document.getElementById('hub-subtitle');
            const backBtn = document.getElementById('back-btn');
            const sectionTitle = document.getElementById('section-title');
            
            let html = '';
            
            if (!currentProject) {
                // LEVEL 1: Projects
                title.textContent = "Available Projects";
                subtitle.textContent = "Select a project folder to view its simulators.";
                sectionTitle.textContent = "Projects";
                backBtn.style.display = "none";
                
                Object.keys(projectData).forEach(proj => {
                    html += `
                        <div onclick="openProject('${proj}')" class="sim-card bg-slate-900 border border-slate-700 rounded-lg p-6 cursor-pointer flex flex-col justify-between group h-32 relative overflow-hidden">
                            <div class="absolute -right-4 -top-4 opacity-10 group-hover:opacity-20 transition-opacity">
                                <svg width="80" height="80" viewBox="0 0 80 80">
                                    <rect x="10" y="10" width="60" height="60" fill="none" stroke="#3b82f6" stroke-width="8"/>
                                </svg>
                            </div>
                            <div>
                                <div class="flex items-center gap-3 mb-2">
                                    <div class="w-3 h-3 rounded-full bg-slate-600 border border-slate-500 group-hover:bg-blue-400 group-hover:border-blue-300 transition-all"></div>
                                    <h3 class="font-bold text-slate-200 group-hover:text-blue-400 transition-colors text-lg">${proj.replace('_', ' ')}</h3>
                                </div>
                                <p class="text-[10px] text-slate-500 font-mono">Contains ${projectData[proj].length} module(s)</p>
                            </div>
                            <div class="mt-4 flex justify-end">
                                <span class="text-xs font-bold text-slate-500 group-hover:text-white transition-colors">VIEW SIMULATIONS &#8594;</span>
                            </div>
                        </div>
                    `;
                });
            } else {
                // LEVEL 2: Simulations
                title.textContent = "Available Simulations";
                subtitle.textContent = `Browsing project: ${currentProject}`;
                sectionTitle.textContent = "Modules";
                backBtn.style.display = "block";
                
                projectData[currentProject].forEach(file => {
                    html += `
                        <div onclick="launchSim('${currentProject}', '${file}')" class="sim-card bg-slate-900 border border-slate-700 rounded-lg p-6 cursor-pointer flex flex-col justify-between group h-32 relative overflow-hidden">
                            <div class="absolute -right-4 -top-4 opacity-10 group-hover:opacity-20 transition-opacity">
                                <svg width="80" height="80" viewBox="0 0 80 80">
                                    <path d="M 0 80 L 40 80 L 40 0 L 80 0" fill="none" stroke="#4ade80" stroke-width="8"/>
                                </svg>
                            </div>
                            <div>
                                <div class="flex items-center gap-3 mb-2">
                                    <div class="w-3 h-3 rounded-full bg-slate-600 border border-slate-500 group-hover:bg-green-400 group-hover:border-green-300 group-hover:shadow-[0_0_10px_#4ade80] transition-all"></div>
                                    <h3 class="font-bold text-slate-200 group-hover:text-green-400 transition-colors truncate text-sm" title="${file}">${file.replace('.html', '')}</h3>
                                </div>
                                <p class="text-[10px] text-slate-500 font-mono break-all ml-6">./${currentProject}/${file}</p>
                            </div>
                            <div class="mt-4 flex justify-end">
                                <span class="text-xs font-bold text-slate-500 group-hover:text-white transition-colors">LAUNCH MODULE &#8599;</span>
                            </div>
                        </div>
                    `;
                });
            }
            
            grid.innerHTML = html;
        }

        function openProject(proj) {
            currentProject = proj;
            renderGrid();
        }

        function goBack() {
            currentProject = null;
            renderGrid();
        }

        function launchSim(proj, filename) {
            // Navigate in the SAME tab using relative paths
            window.location.href = proj + '/' + filename;
        }

        window.onload = () => {
            const requestedProject = new URLSearchParams(window.location.search).get('project');
            if (requestedProject && Object.prototype.hasOwnProperty.call(projectData, requestedProject)) {
                currentProject = requestedProject;
            }
            renderGrid();
        };
    </script>
</body>
</html>
